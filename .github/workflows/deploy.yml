name: Build and Deploy to SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Inject Environment Variables into .htaccess
        run: |
          echo "" >> public/.htaccess
          echo "SetEnv RECIPIENT_EMAIL \"${{ secrets.RECIPIENT_EMAIL }}\"" >> public/.htaccess
          echo "SetEnv CAPTCHA_SECRET \"${{ secrets.CAPTCHA_SECRET }}\"" >> public/.htaccess
          echo "SetEnv GOOGLE_SHEET_WEBAPP_URL \"${{ secrets.GOOGLE_SHEET_WEBAPP_URL }}\"" >> public/.htaccess
          echo "SetEnv DB_HOST \"${{ secrets.DB_HOST }}\"" >> public/.htaccess
          echo "SetEnv DB_NAME \"${{ secrets.DB_NAME }}\"" >> public/.htaccess
          echo "SetEnv DB_USER \"${{ secrets.DB_USER }}\"" >> public/.htaccess
          echo "SetEnv DB_PASS \"${{ secrets.DB_PASS }}\"" >> public/.htaccess
          echo "SetEnv MERCADOPAGO_ACCESS_TOKEN \"${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}\"" >> public/.htaccess
          echo "SetEnv MERCADOPAGO_PUBLIC_KEY \"${{ secrets.MERCADOPAGO_PUBLIC_KEY }}\"" >> public/.htaccess
          echo "SetEnv MERCADOPAGO_SANDBOX \"${{ secrets.MERCADOPAGO_SANDBOX }}\"" >> public/.htaccess

      - name: Build Project
        run: npm run build

      - name: Deploy to SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 2223
          local_path: './dist/.'
          remote_path: ${{ secrets.FTP_REMOTE_PATH }}
          sftpArgs: '-o ConnectTimeout=5'
